<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mate Energy - Tank Dip Calculator</title><style>
:root{--p:#8c3a6e;--pd:#6c2d55;--b:#0284b8;--bg:#f6f7f8}
*{box-sizing:border-box}body{margin:0;font-family:Roboto,Arial,sans-serif;background:var(--bg);color:#333;padding:0 0 14px}.hd{background:#fff;border-bottom:3px solid #00a8e8;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}.hd img{width:340px;max-width:100%;height:auto}.wo{border:1px solid #e3c7da;background:#faf1f7;border-radius:8px;padding:7px 12px;text-align:center;font-size:12px;color:#6c2d55;margin-left:auto}.wo b{display:block;font-size:13px}.sub{text-align:center;font-size:12.5px;color:#666;margin:-8px 0 14px}
.card{background:#fff;border-top:5px solid #00a8e8;border-radius:22px;padding:22px;max-width:520px;margin:14px auto 0;box-shadow:0 4px 14px #0001}
h1{font-size:17px;margin:0 0 14px;color:var(--pd);text-align:center}
.top{background:var(--b);color:#fff;text-align:center;font-weight:700;font-size:19px;padding:14px;border-radius:10px;margin-bottom:16px}
label{font-weight:600;display:block;margin:12px 0 6px}
.tanks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tanks button{padding:14px 0;font-size:16px;font-weight:700;border:2px solid var(--p);background:#fff;color:var(--p);border-radius:10px}
.tanks button.on{background:var(--p);color:#fff}
input{width:100%;font-size:26px;font-weight:700;text-align:center;color:var(--p);padding:12px;border:2px solid #ddd;border-radius:10px}
.btn{width:100%;background:var(--pd);color:#fff;border:0;border-radius:10px;font-size:19px;font-weight:700;padding:15px;margin-top:14px}
.res{margin-top:16px;background:#e9f3f8;border:2px solid var(--p);border-radius:12px;padding:18px;text-align:center;min-height:90px}
.big{font-size:40px;font-weight:800;color:var(--p);line-height:1.15}.sm{font-size:15px;margin-top:8px}.err{color:#b00020;font-weight:700;font-size:18px}
.mg button{background:var(--p);color:#fff;border:0;border-radius:8px;padding:14px 18px;font-size:16px;font-weight:700;margin:6px 6px 0 0}
.note{font-size:12.5px;color:#666;margin-top:6px}footer{text-align:center;margin:18px 0 4px;color:#555}footer b{color:var(--p)}
